<mat-dialog-content>
<div class="dialog-header">
    @if (data.title) {
       <h4>{{data.title |translate }}</h4>
    }

    @if(data.showCloseIcon){
       <mat-icon class="primary-icon " [mat-dialog-close]="false" fontIcon="close"></mat-icon>
    }
</div>
<div class="dialog-content">
    @if (data.content) {
            <p>{{ data.content | translate}}</p>
    }
</div>
    </mat-dialog-content>
    <mat-dialog-actions>
        <div class="buttons">
            @for(button of data.actionButtons; track $index){
                <button mat-flat-button class="primary-button" (click)="closePopup(button.action)">{{button.label |translate}}</button>
            }
        </div>
    </mat-dialog-actions>
